<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<title>電子ペーパーカレンダー 試作</title>
<style>
/* VOICE: 家族の壁掛けカレンダー。静かで、離れても読める
   IDEA: 白黒の電子ペーパー端末そのもの（紙面＋物理ボタン）
   PICTURE: 幅1650の紙面を、画面の横幅いっぱいに縮小表示（高さは画面の縦横比に合わせる。電子ペーパーの1650×2200でも同じ作り）
   COLOUR/TYPE: 白・黒・グレー＋少しの色（日曜・祝日は赤、土曜は青、今日はオレンジ）。URLの mono=1 で白黒だけ。ヒラギノ角ゴ、日付は太い数字
   LAYOUT: 紙面を画面いっぱいに、その下にボタン4つ */
:root{color-scheme:light;--red:#d0262d;--blue:#1f5fbf;--today:#f08a00}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%;background:#262626;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#000;display:flex;flex-direction:column;align-items:center}
#wrap{position:relative;flex:none;margin-top:4px;overflow:hidden;background:#fff}
#paper{position:absolute;left:0;top:0;width:1650px;height:2200px;background:#fff;transform-origin:0 0;padding:44px;display:flex;flex-direction:column;gap:14px}
#flash{position:absolute;inset:0;background:#000;display:none;z-index:9}
header{height:300px;flex:none;display:flex;justify-content:space-between;align-items:flex-start}
.y{font-size:46px;font-weight:700;line-height:1.1}
.m{font-size:200px;font-weight:800;line-height:.95;letter-spacing:-6px}
.m small{font-size:84px;letter-spacing:0;margin-left:12px;font-weight:700}
.td{font-size:32px;font-weight:700;margin-top:6px}
.minis{display:flex;gap:44px}
.mini{width:320px}
.mini h3{font-size:32px;font-weight:800;margin-bottom:6px}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);font-size:22px;text-align:center;row-gap:4px}
.mini .g span{height:32px;line-height:32px}
.mini .h{font-weight:700;border-bottom:2px solid #000}
.mini .sun{background:#000;color:#fff;border-radius:4px;font-weight:700}
.mini .sat{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;font-weight:700}
.wd{height:64px;flex:none;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:4px solid #000}
.wd div{font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center}
.wd .sun span{background:#000;color:#fff;padding:0 22px;border-radius:6px}
.wd .sat span{border-bottom:5px solid #000}
#grid{flex:1;display:grid;min-height:0}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid #000;min-height:0}
.c{position:relative;border-left:2px solid #000;padding:6px 8px 0;overflow:hidden;min-height:0}
.c:first-child{border-left:none}
.c.today{box-shadow:inset 0 0 0 8px #000}
.c.today .dt{padding-left:4px}
.dt{display:flex;align-items:center;gap:8px;height:52px;white-space:nowrap;overflow:hidden}
.n{flex:none;font-size:40px;font-weight:800;line-height:44px;padding:0 6px;border-radius:6px}
.hol .n{background:#000;color:#fff}
.sat .n{border-bottom:5px solid #000;border-radius:0;line-height:40px}
.hn{font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.out .n,.out .hn{color:#9a9a9a}
.out.hol .n{background:#9a9a9a;color:#fff}
.out.sat .n{border-color:#9a9a9a}
.ev{font-size:24px;line-height:31px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev b{font-weight:700;margin-right:6px}
.ev.ad{font-weight:700}
.out .ev{color:#8a8a8a}
.more{font-size:23px;line-height:31px;font-weight:800}
.band{position:absolute;height:32px;background:#c4c4c4;font-size:22px;line-height:32px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.band.s{border-top-left-radius:16px;border-bottom-left-radius:16px}
.band.e{border-top-right-radius:16px;border-bottom-right-radius:16px}
.c.sel{background:#d6d6d6}
.c.sel.today{box-shadow:inset 0 0 0 8px #000}
.details{display:grid;grid-template-columns:1fr 1fr;gap:24px;min-height:0}
.dbox{border:3px solid #000;border-radius:10px;padding:10px 16px;overflow:hidden;min-height:0}
.dbox.today{border-width:8px}
.dh{display:flex;align-items:center;gap:12px;height:56px;border-bottom:2px solid #000;margin-bottom:10px;white-space:nowrap}
.dn{font-size:36px;font-weight:800;padding:0 8px;border-radius:6px}
.dh.hol .dn{background:#000;color:#fff}
.dh.sat .dn{border-bottom:5px solid #000;border-radius:0}
.dhn{font-size:24px;font-weight:700}
.dl{margin-left:auto;font-size:22px;font-weight:700;color:#555}
.dbox ul{list-style:none;font-size:30px;line-height:42px}
.dbox ul.two{columns:2;column-gap:24px}
.dbox li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;break-inside:avoid}
.dbox li b{margin-right:10px}
.dbox li.ad{font-weight:700}
.dbox li.pb{background:#c4c4c4;border-radius:21px;padding:0 16px;font-weight:700;margin-bottom:4px}
.dbox li.more{font-weight:800}
.dbox li.none{color:#777}
.memo{height:190px;flex:none;border-top:4px solid #000;padding-top:14px;display:flex;gap:32px}
.memo h4{font-size:30px;font-weight:800;flex:none}
.memo ul{list-style:none;columns:2;column-gap:48px;font-size:27px;line-height:40px;flex:1;column-fill:auto;height:160px;overflow:hidden}
.memo li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo li b{margin-left:8px;font-size:23px}
.memo li.more{font-weight:800}
.memo li.f{color:#999}
#bar{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-top:8px}
#bar button{font:inherit;font-size:19px;font-weight:700;height:56px;border:2px solid #000;border-radius:10px;background:#e8e8e8;color:#000;-webkit-tap-highlight-color:transparent}
#bar button:active{background:#000;color:#fff}
/* 月（大）：表題を1行にし、前後の月を出さない。メモは2列×6行 */
#paper.compact header{height:96px;align-items:center}
#paper.compact header>div:first-child{flex:1;display:flex;align-items:baseline;gap:20px}
#paper.compact .y{font-size:52px}
#paper.compact .m{font-size:84px;letter-spacing:0;line-height:1}
#paper.compact .m small{font-size:52px;margin-left:4px}
#paper.compact .td{margin:0 0 0 auto;font-size:40px}
#paper.compact .minis{display:none}
/* 1週＋詳細：詳細枠は1つで横幅いっぱい */
.details.one{grid-template-columns:1fr}
/* 下のボタン：位置と数はどのページも同じで、ページに合わせて名前を変える */
#bar button.primary{background:#000;color:#fff}
#bar button.off{opacity:.45}
/* 予定の追加：紙面の上に重ねる入力画面 */
.add{position:absolute;inset:0;background:#fff;padding:44px;display:none;flex-direction:column;gap:30px;z-index:5}
#paper.adding .add{display:flex}
.ah{display:flex;align-items:baseline;gap:30px;border-bottom:4px solid #000;padding-bottom:16px}
.al{font-size:44px;font-weight:800}
#aDate{font-size:64px;font-weight:800}
#aTitle{font:inherit;font-size:56px;height:120px;border:4px solid #000;border-radius:16px;padding:0 28px;width:100%;color:#000;background:#fff;-webkit-user-select:text;user-select:text;outline:none}
/* いつ：左に「時間を決める／終日」、右に「はじまり 〜 おわり」の大きな表示（押すと、どちらを選ぶか切り替わる） */
.when{display:flex;gap:24px;height:250px}
.seg{display:flex;flex-direction:column;gap:14px;flex:none;width:340px}
.seg button{flex:1;font:inherit;font-size:40px;font-weight:800;border:3px solid #000;border-radius:16px;background:#fff;color:#000;-webkit-tap-highlight-color:transparent}
.seg button.on{background:#000;color:#fff}
.tcard{flex:1;display:flex;align-items:center;gap:14px}
.slot{flex:1;height:100%;font:inherit;color:#000;border:3px solid #000;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;-webkit-tap-highlight-color:transparent}
.slot small{font-size:32px;font-weight:700;color:#555}
.slot b{font-size:88px;font-weight:800;line-height:1}
.slot.act{box-shadow:inset 0 0 0 9px #000;background:#eee}
.til{font-size:64px;font-weight:800}
.tcard.allday .slot,.tcard.allday .til{display:none}
.allx{display:none;flex:1;height:100%;align-items:center;justify-content:center;font-size:72px;font-weight:800;border:3px dashed #000;border-radius:18px}
.tcard.allday .allx{display:flex}
/* 時刻を選ぶところ：午前・午後で分けて1行6個（0〜23時）、分は4つ */
.picker h5{font-size:42px;font-weight:800;margin-bottom:4px}
.picker.hide{visibility:hidden}
.hrow{display:flex;align-items:center;gap:20px;padding:18px 0}
.hrow+.hrow{border-top:3px solid #c8c8c8} /* 午前・午後・分の間にうすい横線 */
.hrow>span{flex:none;width:96px;font-size:36px;font-weight:800}
.tb{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tb.m4{grid-template-columns:repeat(4,1fr)}
.tb button{font:inherit;font-size:48px;font-weight:700;height:140px;border:3px solid #000;border-radius:14px;background:#fff;color:#000;-webkit-tap-highlight-color:transparent}
.tb button.on{background:#000;color:#fff}
.tb button:disabled{opacity:.2}
/* 話して入れる：キーボードのマイクで話した文をAIが読み取り、下の欄に入れる */
.voice{display:none;gap:20px;height:120px}
#paper.voiceon .voice{display:flex}
#aSay{flex:1;font:inherit;font-size:44px;border:4px dashed #000;border-radius:16px;padding:0 28px;color:#000;background:#fff;-webkit-user-select:text;user-select:text;outline:none}
#aRead{flex:none;width:280px;font:inherit;font-size:44px;font-weight:800;border:none;border-radius:16px;background:#000;color:#fff;-webkit-tap-highlight-color:transparent}
#aRead:disabled{opacity:.4}
.vst{margin-left:auto;font-size:30px;font-weight:700;color:#555;white-space:nowrap}
.aerr{font-size:38px;font-weight:800;color:#d0262d;min-height:46px}
/* 登録したあとの「取り消す」 */
.undo{position:absolute;left:44px;right:44px;bottom:44px;height:130px;background:#000;color:#fff;border-radius:18px;padding-left:36px;display:none;align-items:center;gap:24px;font-size:42px;font-weight:700;z-index:6}
.undo.show,.cfm.show{display:flex}
/* メモを完了にする前の確認 */
.cfm{position:absolute;left:44px;right:44px;bottom:44px;min-height:130px;background:#fff;color:#000;border:6px solid #000;border-radius:18px;padding:16px 16px 16px 36px;display:none;align-items:center;gap:20px;font-size:42px;font-weight:700;z-index:7}
.cfm span{flex:1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cfm button.go{background:#000;color:#fff}
.memo li[data-i]{cursor:pointer}
.undo span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo button,.cfm button{flex:none;font:inherit;font-size:42px;font-weight:800;height:130px;padding:0 48px;background:#fff;color:#000;border:4px solid #000;border-radius:18px}
/* 夜の画面：白黒を反転して暗くする（色は色相を戻して残す）。周りも真っ黒に */
body.night{background:#000}
body.night #wrap,body.night #bar{filter:invert(1) hue-rotate(180deg) brightness(.5)}
body.night #msg{color:#333}
#msg{flex:none;color:#bdbdbd;font-size:13px;line-height:20px;height:24px;padding-top:4px;text-align:center}
/* カラー表示（URLに mono=1 があれば白黒のまま） */
body.color .mini .sun{background:none;color:var(--red)}
body.color .mini .sat{text-decoration:none;color:var(--blue)}
body.color .wd .sun span{background:none;color:var(--red);padding:0}
body.color .wd .sat span{border-bottom:none;color:var(--blue)}
body.color .hol .n{background:none;color:var(--red)}
body.color .sat .n{border-bottom:none;border-radius:6px;line-height:44px;color:var(--blue)}
body.color .out.hol .n{background:none;color:#eaa3a6}
body.color .out.sat .n{color:#a3bce3}
body.color .c.today,body.color .c.sel.today{box-shadow:inset 0 0 0 8px var(--today)}
body.color .dbox.today{border-color:var(--today)}
body.color .dh.hol .dn{background:none;color:var(--red)}
body.color .dh.sat .dn{border-bottom:none;border-radius:6px;color:var(--blue)}
</style>
</head>
<body>
<div id="wrap">
  <div id="paper">
    <header>
      <div><div class="y" id="y"></div><div class="m" id="m"></div><div class="td" id="td"></div></div>
      <div class="minis" id="minis"></div>
    </header>
    <div class="wd"><div class="sun"><span>日</span></div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat"><span>土</span></div></div>
    <div id="grid"></div>
    <div class="add" id="add">
      <div class="ah"><span class="al">予定を追加</span><span id="aDate"></span><span class="vst" id="aVst"></span></div>
      <div class="voice"><input id="aSay" type="text" maxlength="200" placeholder="話して入れる（キーボードのマイクで話す）" autocomplete="off" enterkeyhint="go"><button id="aRead">読み取る</button></div>
      <input id="aTitle" type="text" maxlength="60" placeholder="予定名（例：歯医者）" autocomplete="off" enterkeyhint="done">
      <div class="when">
        <div class="seg" id="aKind"><button data-v="t">時間を決める</button><button data-v="a">終日</button></div>
        <div class="tcard" id="aCard">
          <button class="slot" data-v="s"><small>はじまり</small><b id="aSv"></b></button>
          <span class="til">〜</span>
          <button class="slot" data-v="e"><small id="aEl">おわり</small><b id="aEv"></b></button>
          <div class="allx">終日（時刻なし）</div>
        </div>
      </div>
      <div class="picker" id="aPick">
        <h5 id="aPT"></h5>
        <div class="hrow"><span>午前</span><div class="tb" id="aH1"></div></div>
        <div class="hrow"><span>午後</span><div class="tb" id="aH2"></div></div>
        <div class="hrow"><span>分</span><div class="tb m4" id="aM"></div></div>
      </div>
      <div class="aerr" id="aErr"></div>
    </div>
    <div class="undo" id="undo"><span id="uText"></span><button id="uBtn">取り消す</button></div>
    <div class="cfm" id="cfm"><span id="cText"></span><button id="cNo">やめる</button><button class="go" id="cGo">完了にする</button></div>
    <div class="memo"><h4>メモ</h4><ul id="memo">
      <li>・上履きを持ち帰る（金）</li><li>・町内会費 1,000円 集金あり</li>
      <li>・年賀状の準備</li><li>・冬休みの宿題プリントを確認</li>
    </ul></div>
  </div>
  <div id="flash"></div>
</div>
<div id="bar">
  <button id="bPrev">◀ 前</button><button id="bToday">今日</button><button id="bView">表示切替</button><button id="bNext">次 ▶</button>
</div>
<div id="msg">予定とメモはサンプルです（試作版）</div>
<script>
{
const W=1650,PAD=44,WDH=64,GAP=14;
// 紙面の幅は1650で固定し、高さは画面の縦横比に合わせる（iPadでは横幅いっぱいに表示）
let H=2200;
const HEAD={m:300,mL:96,w3:300,w2:300,w1:96},MEMO={m:190,mL:270,w3:190,w2:190,w1:350};
const gridH=()=>H-PAD*2-HEAD[mode]-WDH-MEMO[mode]-GAP*3;
const LINE=31,DATE_H=58,LANE=35;
const DOW='日月火水木金土';
let MSG='予定とメモはサンプルです（試作版）';
// 祝日（試作用。本番はGoogleの「日本の祝日」カレンダーから取得）
const HOL={
'2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日','2026-02-23':'天皇誕生日','2026-03-20':'春分の日',
'2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日',
'2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日',
'2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日',
'2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日','2027-02-23':'天皇誕生日','2027-03-21':'春分の日',
'2027-03-22':'振替休日','2027-04-29':'昭和の日','2027-05-03':'憲法記念日','2027-05-04':'みどりの日','2027-05-05':'こどもの日',
'2027-07-19':'海の日','2027-08-11':'山の日','2027-09-20':'敬老の日','2027-09-23':'秋分の日','2027-10-11':'スポーツの日',
'2027-11-03':'文化の日','2027-11-23':'勤労感謝の日'};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const tm=t=>{if(!t)return -1;const [h,m]=t.split(':');return h*60+ +m};
const dayDiff=(a,b)=>Math.round((b-a)/864e5);

let T=today(),view=new Date(T.getFullYear(),T.getMonth(),1),busy=false,idle=null,msgTimer=null;

let SINGLE={},BANDS=[];
const addE=(d,time,title)=>{const k=key(d);(SINGLE[k]=SINGLE[k]||[]).push({time,title})};
const parseKey=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));

// ---- Googleカレンダー連携（Apps Script） ----
// 接続先はURLの #d=デプロイID&k=合言葉 で受け取り、この端末に保存する
let cfg=null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
{
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('d')&&h.get('k')){cfg={d:h.get('d'),k:h.get('k')};store.set('epc-cfg',cfg)}
  else cfg=store.get('epc-cfg');
}
// 表示の設定：URLの mono=1 で白黒だけ、eink=1 で画面切り替えの待ち時間あり（電子ペーパーの再現）
// URLに書いたときはこの端末に保存する（書いていなければ前回の設定。初期値はカラー・待ち時間なし）
const opt=k=>{const v=new URLSearchParams(location.hash.slice(1)).get(k);if(v!==null)store.set('epc-'+k,v);return (v!==null?v:store.get('epc-'+k))==='1'};
const MONO=opt('mono'),EINK=opt('eink');
// 夜の時間帯：URLの night=23-5 のように「始まり-終わり」（時）で指定。night=off で使わない。初期値は22時〜6時
const NIGHT=(()=>{const h=new URLSearchParams(location.hash.slice(1)).get('night');if(h!==null)store.set('epc-night',h);
  const v=h!==null?h:(store.get('epc-night')||'22-6');const m=/^(\d{1,2})-(\d{1,2})$/.exec(v);return m?[+m[1],+m[2]]:null})();
document.body.classList.toggle('color',!MONO);
const EVS=new Map(),loaded=new Set();
const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function indexEvents(){
  SINGLE={};BANDS=[];
  EVS.forEach(ev=>{
    if(ev.s===ev.e)(SINGLE[ev.s]=SINGLE[ev.s]||[]).push({time:ev.tm,title:ev.t});
    else BANDS.push({s:parseKey(ev.s),e:parseKey(ev.e),t:ev.t});
  });
}
let ADD_OK=false; // Apps Script 側で ADD_CALENDAR_ID が設定されていれば true
let VOICE_OK=false; // Apps Script 側で GEMINI_API_KEY が設定されていれば true（話して入れる）
function saveCache(){store.set('epc-cache',{ev:[...EVS.values()],h:HOL_LIVE,m:MEMO_LIVE,add:ADD_OK,voice:VOICE_OK})}
// メモ欄：Google ToDoの未完了タスクのうち、表示中の月に期限があるものだけ（翌月には繰り越さない）
// f:1 は毎年のメモの「予定」（去年の記録から。その日が来て本物が出るまで薄い字で出す）
let MEMO_LIVE=null,MEMO_SHOWN=[];
const memoMax=()=>mode==='w1'?16:mode==='mL'?12:8; // 2列×8行（1週＋詳細）／2列×6行（月（大））／2列×4行
function renderMemo(y,mo){
  if(!MEMO_LIVE)return;
  const pre=y+'-'+pad(mo+1)+'-';
  const items=MEMO_LIVE.filter(m=>m.due&&m.due.startsWith(pre));
  const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let list=items,more='';
  const MEMO_MAX=memoMax();
  if(list.length>MEMO_MAX){list=list.slice(0,MEMO_MAX-1);more=`<li class="more">ほか${items.length-list.length}件</li>`}
  MEMO_SHOWN=list;
  $('memo').innerHTML=list.map((m,i)=>`<li${m.f?' class="f"':m.id?` data-i="${i}"`:''}>・${esc(m.t)}</li>`).join('')+more
    +(items.length?'':'<li style="color:#777">メモはありません</li>');
}
const HOL_LIVE={};
async function fetchRange(a,b){
  const url=`https://script.google.com/macros/s/${cfg.d}/exec?k=${encodeURIComponent(cfg.k)}&from=${key(a)}&to=${key(b)}`;
  const r=await fetch(url);const j=await r.json();
  if(j.error)throw new Error(j.error);
  const as=key(a),bs=key(b);
  [...EVS.keys()].forEach(k=>{const ev=EVS.get(k);if(ev.s<=bs&&ev.e>=as)EVS.delete(k)});
  j.ev.forEach(ev=>EVS.set(ev.k,ev));
  Object.assign(HOL,j.h);Object.assign(HOL_LIVE,j.h);
  if(j.m)MEMO_LIVE=j.m;
  ADD_OK=!!j.add;VOICE_OK=!!j.voice;
  for(let m=new Date(a.getFullYear(),a.getMonth(),1);m<=b;m=new Date(m.getFullYear(),m.getMonth()+1,1))loaded.add(monthKey(m));
  saveCache();
  return j;
}
let loading=false;
// 表示中の範囲（前後1か月を含む）を取得する
async function ensure(force){
  if(!cfg||loading)return;
  const [a,b]=range();
  const ms=[];
  for(let m=new Date(a.getFullYear(),a.getMonth()-1,1);m<=new Date(b.getFullYear(),b.getMonth()+1,1);m=new Date(m.getFullYear(),m.getMonth()+1,1))ms.push(m);
  const need=force?ms:ms.filter(m=>!loaded.has(monthKey(m)));
  if(!need.length)return;
  loading=true;
  try{
    const last=need[need.length-1];
    const j=await fetchRange(need[0],new Date(last.getFullYear(),last.getMonth()+1,0));
    MSG=(j.w?`注意：合言葉の違うアクセスが24時間で${j.w}件あります ・ `:'')
      +`Googleカレンダー ${j.at} 更新`;
    $('msg').style.color=j.w?'#fff':'';$('msg').style.fontWeight=j.w?'700':'';
  }catch(e){
    MSG='更新できませんでした。前回のデータを表示しています';
  }
  loading=false;
  $('msg').textContent=MSG;indexEvents();render();
}

// mode: 'm'=月、'mL'=月（大）、'w3'=3週、'w2'=2週＋詳細、'w1'=1週＋詳細。ws=週の始まり（日曜）、sel=選んだ日

const MODES=['m','mL','w3','w2'],MODE_NAME={m:'月',mL:'月（大）',w3:'3週',w2:'2週＋詳細',w1:'1週＋詳細'};
const isMonth=()=>mode==='m'||mode==='mL';
const sunday=d=>addD(d,-d.getDay());
let mode='m',ws=sunday(T),sel=T,backMode='m';
function range(){
  if(isMonth()){const f=view,s=sunday(f),l=new Date(f.getFullYear(),f.getMonth()+1,0);return [s,addD(l,6-l.getDay())]}
  if(mode==='w3')return [ws,addD(ws,20)];

function goHome(){

function isHome(){
  if(isMonth())return +view===+new Date(T.getFullYear(),T.getMonth(),1);
  if(mode==='w3')return +ws===+sunday(T);
  return +ws===+sunday(T)&&+sel===+T;

function mini(y,mo){
  const f=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate();
  let h=[...DOW].map(c=>`<span class="h">${c}</span>`).join('')+'<span></span>'.repeat(f.getDay());
  for(let d=1;d<=dim;d++){const dt=new Date(y,mo,d),w=dt.getDay();
    h+=`<span class="${w===0||HOL[key(dt)]?'sun':w===6?'sat':''}">${d}</span>`}
  return `<div class="mini"><h3>${mo+1}月</h3><div class="g">${h}</div></div>`;
}
const md=d=>`${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;

// 1週分の行。mo=月表示のときの当月（それ以外の日は薄く）、null なら薄くしない
function weekRow(w0,rowH,mo){
  const we=addD(w0,6);
  // 期間の予定：この週にかかる部分を帯にして、重ならないよう段に分ける
  const segs=BANDS.filter(b=>b.s<=we&&b.e>=w0)
    .map(b=>({b,a:b.s<w0?w0:b.s,z:b.e>we?we:b.e}))
    .sort((p,q)=>p.a-q.a||q.z-p.z);
  const lanes=[];
  segs.forEach(g=>{let l=lanes.findIndex(end=>end<g.a);if(l<0){l=lanes.length;lanes.push(g.z)}else lanes[l]=g.z;g.l=l});
  const nl=lanes.length,cap=Math.max(1,Math.floor((rowH-2-DATE_H-nl*LANE-8)/LINE));
  let cells='';
  for(let c=0;c<7;c++){
    const d=addD(w0,c),k=key(d),hn=HOL[k],w=d.getDay(),cls=['c'];
    if(mo!==null&&d.getMonth()!==mo)cls.push('out');
    if(w===0||hn)cls.push('hol');else if(w===6)cls.push('sat');
    if(+d===+T)cls.push('today');
    if((mode==='w2'||mode==='w1')&&+d===+sel)cls.push('sel');
    // 並び順：終日の予定が先、その後に時刻順
    const evs=(SINGLE[k]||[]).slice().sort((a,b)=>tm(a.time)-tm(b.time));
    let list=evs,more=0;
    if(evs.length>cap){list=evs.slice(0,cap-1);more=evs.length-list.length}
    const num=(mo===null&&d.getDate()===1)?`${d.getMonth()+1}/1`:d.getDate();
    cells+=`<div class="${cls.join(' ')}" data-d="${k}"><div class="dt"><span class="n">${num}</span>${hn?`<span class="hn">${hn}</span>`:''}</div>`
      +list.map(e=>e.time?`<div class="ev"><b>${e.time}</b>${e.title}</div>`:`<div class="ev ad">${e.title}</div>`).join('')
      +(more?`<div class="more">+${more}件</div>`:'')+'</div>';
  }
  const bands=segs.map(g=>{
    const c0=dayDiff(w0,g.a),span=dayDiff(g.a,g.z)+1,st=+g.a===+g.b.s,en=+g.z===+g.b.e;
    return `<div class="band${st?' s':''}${en?' e':''}" style="left:calc(${c0}*100%/7 + 6px);width:calc(${span}*100%/7 - 12px);bottom:${6+(nl-1-g.l)*LANE}px">${st?'':'… '}${g.b.t}</div>`;
  }).join('');
  return `<div class="wk">${cells}${bands}</div>`;
}

// 詳細枠（選んだ日・次の日）
const DL=42,DHEAD=70;
function detail(d,label,h){
  const k=key(d),hn=HOL[k];
  const items=BANDS.filter(b=>b.s<=d&&b.e>=d).map(b=>`<li class="pb">${b.t}</li>`)
    .concat((SINGLE[k]||[]).slice().sort((a,b)=>tm(a.time)-tm(b.time))
      .map(e=>e.time?`<li><b>${e.time}</b>${e.title}</li>`:`<li class="ad">${e.title}</li>`));
  const cap=Math.max(1,Math.floor((h-DHEAD-20)/DL));
  let list=items,two=false,more='';
  if(items.length>cap){two=true;if(items.length>cap*2){list=items.slice(0,cap*2-1);more=`<li class="more">ほか${items.length-list.length}件</li>`}}
  const w=d.getDay(),cls=(w===0||hn)?'hol':w===6?'sat':'';
  return `<div class="dbox${+d===+T?' today':''}"><div class="dh ${cls}"><span class="dn">${md(d)}</span>${hn?`<span class="dhn">${hn}</span>`:''}<span class="dl">${label}</span></div>`
    +`<ul class="${two?'two':''}">${list.join('')}${more}${items.length?'':'<li class="none">予定なし</li>'}</ul></div>`;
}

  const [a,b]=range();
  const base=isMonth()?view:(mode==='w2'||mode==='w1'?sel:ws);
  const y=base.getFullYear(),mo=base.getMonth();
  renderMemo(y,mo);
  $('y').textContent=y+'年';
  $('m').innerHTML=(mo+1)+'<small>月</small>';
  const span=isMonth()||mode==='w1'?'':`${MODE_NAME[mode]}：${a.getMonth()+1}/${a.getDate()}〜${addD(ws,mode==='w3'?20:13).getMonth()+1}/${addD(ws,mode==='w3'?20:13).getDate()}　`;
  $('td').textContent=`${span}今日 ${md(T)}`;
  const p=new Date(y,mo-1,1),n=new Date(y,mo+1,1);
  $('minis').innerHTML=mini(p.getFullYear(),p.getMonth())+mini(n.getFullYear(),n.getMonth());
  let html='';
  $('paper').classList.toggle('compact',mode==='mL'||mode==='w1');
  $('paper').classList.toggle('w1',mode==='w1');
  const mm=$('paper').querySelector('.memo');mm.style.height=MEMO[mode]+'px';$('memo').style.height=(MEMO[mode]-30)+'px';
  const GRID_H=gridH();
  if(isMonth()){
    const first=view,start=sunday(first),dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    const rows=Math.ceil((first.getDay()+dim)/7),rowH=GRID_H/rows;
    g.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;
    for(let r=0;r<rows;r++)html+=weekRow(addD(start,r*7),rowH,first.getMonth());
  }else if(mode==='w3'){
    const rowH=GRID_H/3;
    g.style.gridTemplateRows='repeat(3,minmax(0,1fr))';
    for(let r=0;r<3;r++)html+=weekRow(addD(ws,r*7),rowH,null);
  }else if(mode==='w1'){
    const rowH=Math.round(GRID_H*0.38),dh=GRID_H-rowH-GAP;
    g.style.gridTemplateRows=`${rowH}px ${GAP}px minmax(0,1fr)`;
    html=weekRow(ws,rowH,null)+'<div></div>'
      +`<div class="details one">${detail(sel,+sel===+T?'今日':'選んだ日',dh)}</div>`;
  }else{
    const rowH=GRID_H/3,dh=GRID_H-rowH*2-GAP;
    g.style.gridTemplateRows=`${rowH}px ${rowH}px ${GAP}px minmax(0,1fr)`;
    html=weekRow(ws,rowH,null)+weekRow(addD(ws,7),rowH,null)+'<div></div>'
      +`<div class="details">${detail(sel,'選んだ日',dh)}${detail(addD(sel,1),'次の日',dh)}</div>`;
  }
  g.innerHTML=html;
  // 下のボタン：1週＋詳細では「前の日／戻る／＋予定を追加／次の日」、入力画面では「前の日／やめる／登録する／次の日」
  const w1=mode==='w1';
  $('paper').classList.toggle('adding',adding);
  $('bPrev').textContent=w1||adding?'◀ 前の日':'◀ 前';
  $('bToday').textContent=adding?'やめる':w1?'戻る':'今日';
  $('bView').textContent=adding?(sending?'登録中…':'登録する'):w1?'＋ 予定を追加':'表示切替';
  $('bNext').textContent=w1||adding?'次の日 ▶':'次 ▶';
  $('bView').classList.toggle('primary',w1||adding);
  $('bView').classList.toggle('off',w1&&!adding&&!canAdd());
}

// ---- 話して入れる：文をApps Script経由でAIに読み取らせ、入力画面に入れる（登録は人が「登録する」を押す） ----
let reading=false;
const PARSE_ERR={'unknown':'うまく読み取れませんでした。言い方を変えるか、下で入れてください',
  'bad date':'今日より前か、1年より先の日になりました。日付を言い直してください','quota':'AIの無料枠の上限です。少し待つか、下で入れてください',
  'limit':'今日はこれ以上読み取れません（1日60件まで）','voice off':'話して入れる機能は止めてあります','too long':'文が長すぎます（200文字まで）',
  'busy':'混み合っています。もう一度押してください','forbidden':'接続の設定を確かめてください','ai':'AIにつながりませんでした'};
async function readVoice(){
  touched();
  const text=$('aSay').value.trim();
  if(!text){$('aErr').textContent='マイクで話すか、文を入れてください';return}
  if(reading)return;
  reading=true;$('aRead').disabled=true;$('aSay').blur();$('aVst').textContent='読み取り中…';$('aErr').textContent='';
  const t0=Date.now();
  try{
    let r;
    if(!cfg){await new Promise(f=>setTimeout(f,400));r={ok:true,d:key(A.d),s:'15:00',e:'',t:text.slice(0,60),sample:true}}
    else r=await post({act:'parse',text,base:key(A.d)}); // 日付を言わなかったときは、選んでいる日にする
    if(!adding)return;
    if(!r.ok)throw new Error(PARSE_ERR[r.error]||('読み取れませんでした'+(r.msg?'：'+r.msg:'')));
    A.d=sel=parseKey(r.d);ws=sunday(sel);
    A.allDay=!r.s;A.s=r.s?tm(r.s):null;A.e=r.e?tm(r.e):null;A.act='s';
    if(r.t)$('aTitle').value=r.t;
    render();renderAdd();
    const sec=x=>(x/1000).toFixed(1);
    $('aVst').textContent=r.sample?'サンプル（AIには送っていません）':`読み取りました ${sec(Date.now()-t0)}秒（AI ${sec(r.aiMs)}秒）`;
    $('aErr').textContent=r.t?'':'予定名を入れてください';
  }catch(err){
    $('aVst').textContent='';
    $('aErr').textContent=err.message&&!/fetch|network|JSON/i.test(err.message)?err.message:'読み取れませんでした。通信を確かめてください';
  }finally{reading=false;$('aRead').disabled=false}
}

$('aSay').addEventListener('input',()=>touched());
$('aSay').addEventListener('keydown',e=>{if(e.key==='Enter')readVoice()});
$('aTitle').addEventListener('keydown',e=>{if(e.key==='Enter')$('aTitle').blur()});
const ADD_ERR={'bad title':'予定名を確かめてください（60文字まで）','bad date':'今日より前や、1年より先の日には登録できません',
  'bad time':'時刻を確かめてください','limit':'今日はこれ以上登録できません（1日20件まで）','add disabled':'予定の追加の設定がされていません',
  'forbidden':'接続の設定を確かめてください','busy':'混み合っています。もう一度押してください'};
async function post(o){
  const r=await fetch(`https://script.google.com/macros/s/${cfg.d}/exec`,{method:'POST',body:JSON.stringify(Object.assign({k:cfg.k},o))});
  return r.json();
}
async function submit(){
  if(sending)return;
  const t=$('aTitle').value.trim();
  if(!t){$('aErr').textContent='予定名を入れてください';return}
  if(!A.allDay&&A.s===null){$('aErr').textContent='はじまりの時刻を選んでください（時刻がなければ「終日」）';return}
  const s=A.allDay?'':fmtm(A.s),e=A.allDay||A.e===null?'':fmtm(A.e);
  sending=true;render();
  try{
    if(!cfg){ // サンプル：この画面の中だけに追加する（保存されない）
      addE(A.d,s,t);lastAdded={sample:true,k:key(A.d),t};
    }else{
      const j=await post({act:'add',d:key(A.d),t,s,e});
      if(!j.ok)throw new Error(ADD_ERR[j.error]||'登録できませんでした');
      EVS.set(j.ev.k,j.ev);indexEvents();saveCache();lastAdded={id:j.id,k:j.ev.k,t};
    }
    sel=A.d;ws=sunday(sel);
    closeAdd();showUndo(`「${t}」を登録しました${cfg?'':'（サンプル）'}`);
  }catch(err){
    sending=false;render();
    $('aErr').textContent=err.message&&!/fetch|network|JSON/i.test(err.message)?err.message:'登録できませんでした。通信を確かめてください';
  }
}
function showUndo(text,ms=10000){ // 予定の登録は10秒、メモの完了は5秒
  if(lastAdded)$('uBtn').style.display='';
  clearTimeout(undoTimer);$('uText').textContent=text;$('undo').classList.add('show');
  undoTimer=setTimeout(()=>$('undo').classList.remove('show'),ms);
}
$('uBtn').addEventListener('click',async()=>{
  touched();clearTimeout(undoTimer);$('undo').classList.remove('show');
  const x=lastAdded;lastAdded=null;if(!x)return;
  if(x.done){
    try{const j=await post({act:'undone',id:x.done.id});if(!j.ok)throw 0;
      MEMO_LIVE.push(x.done);MEMO_LIVE.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);saveCache();render();say('未完了に戻しました')}
    catch(e){say('戻せませんでした。ToDoアプリの「完了済み」から戻してください')}
    return}
  if(x.sample){const a=SINGLE[x.k]||[];const i=a.findIndex(e=>e.title===x.t);if(i>=0)a.splice(i,1);render();say('取り消しました');return}
  try{
    const j=await post({act:'undo',id:x.id});
    if(!j.ok)throw 0;
    EVS.delete(x.k);indexEvents();saveCache();render();say('取り消しました');
  }catch(e){say('取り消せませんでした。スマホのカレンダーから消してください')}
});

// ---- メモをタップして完了にする（確認をはさむ。グレーの予定は対象外） ----
let doneT=null;
const DONE_ERR={'limit':'今日はこれ以上完了にできません（1日30件まで）','already':'もう完了になっています',
  'not found':'このメモは見つかりませんでした','busy':'混み合っています。もう一度押してください','forbidden':'接続の設定を確かめてください'};
function closeCfm(){doneT=null;$('cfm').classList.remove('show')}
$('memo').addEventListener('click',e=>{
  const li=e.target.closest('li[data-i]');if(!li||adding)return;touched();
  const m=MEMO_SHOWN[+li.dataset.i];if(!m||!m.id)return;
  doneT=m;$('cText').textContent=`「${m.t}」を完了にしますか？`;$('cfm').classList.add('show');
});
$('cNo').addEventListener('click',()=>{touched();closeCfm()});
$('cGo').addEventListener('click',async()=>{
  touched();const m=doneT;if(!m||sending)return;sending=true;
  try{
    const j=await post({act:'done',id:m.id});
    if(!j.ok&&j.error!=='already')throw new Error(DONE_ERR[j.error]||('完了にできませんでした'+(j.msg?'：'+j.msg:'')));
    MEMO_LIVE=MEMO_LIVE.filter(x=>x.id!==m.id);saveCache();closeCfm();render();
    lastAdded={done:m};showUndo(`「${m.t}」を完了にしました`,5000);
  }catch(err){closeCfm();lastAdded=null;$('uBtn').style.display='none'; // エラーは下の黒い帯で目立つように出す
    showUndo(err.message&&!/fetch|network|JSON/i.test(err.message)?err.message:'完了にできませんでした。通信を確かめてください')}
  sending=false;
});

// 画面の切り替え。eink=1 のときは電子ペーパーの書き換えを再現：黒→白→新しい画面（合計約0.65秒）
function refresh(fn){
  if(!EINK){fn();render();ensure();return}
  if(busy)return;busy=true;
  const f=$('flash');f.style.background='#000';f.style.display='block';
  setTimeout(()=>{fn();render();f.style.background='#fff';ensure()},200);
  setTimeout(()=>{f.style.display='none';busy=false},650);
}
// 夜の画面：夜の時間帯で、最後に触ってから3分たっていれば暗くする。触るとふだんの画面に戻る
let wakeUntil=0;
const inNight=()=>{if(!NIGHT)return false;const h=new Date().getHours(),[a,b]=NIGHT;return a<b?(h>=a&&h<b):(h>=a||h<b)};
function applyNight(){document.body.classList.toggle('night',inNight()&&Date.now()>wakeUntil)}
// 夜の画面のときの最初のタッチは、画面を戻すだけにする（ボタンなどは押さない）
document.addEventListener('click',e=>{
  if(!document.body.classList.contains('night'))return;
  e.preventDefault();e.stopPropagation();touched();
},true);
function touched(){
  wakeUntil=Date.now()+180000;applyNight();
  clearTimeout(idle);
  // 3分操作がなければ今日に戻る（表示の種類はそのまま）
  idle=setTimeout(()=>{T=today();if(adding)closeAdd();closeCfm();if(!isHome())refresh(goHome)},180000);
}
function say(t){
  clearTimeout(msgTimer);$('msg').textContent=t;
  msgTimer=setTimeout(()=>{$('msg').textContent=MSG},2500);
}
function step(dir){
  if(isMonth())view=new Date(view.getFullYear(),view.getMonth()+dir,1);
  else if(mode==='w3')ws=addD(ws,7*dir);
  else if(mode==='w1'){sel=addD(sel,dir);ws=sunday(sel)} // 1週＋詳細：選んだ日を1日ずつ動かし、週も合わせる
  else{
    // 2週＋詳細：選んだ日を1日ずつ動かし、2週の端を超えたら1週送る
    sel=addD(sel,dir);
    if(sel<ws)ws=addD(ws,-7);
    if(sel>addD(ws,13))ws=addD(ws,7);
  }
}
function nextMode(){
  const nm=MODES[(MODES.indexOf(mode)+1)%MODES.length];
  if(nm==='w3'){ // 月→3週：今月なら今週から、それ以外はその月の1日の週から
    ws=+view===+new Date(T.getFullYear(),T.getMonth(),1)?sunday(T):sunday(view);
  }else if(nm==='w2'){ // 3週→2週＋詳細：今日が範囲内なら今日を選ぶ
    sel=(T>=ws&&T<=addD(ws,13))?T:ws;
  }else if(nm==='m'){ // 2週＋詳細→月：選んでいた日の月
    view=new Date(sel.getFullYear(),sel.getMonth(),1);
  }
  mode=nm;
}
// 入力画面では、前・次で登録する日を1日ずつ動かす
const addStep=dir=>{const d=addD(A.d,dir);if(d<T)return say('今日より前の日には登録できません');A.d=sel=d;ws=sunday(sel);render();renderAdd()};
$('bPrev').addEventListener('click',()=>{touched();if(adding)return addStep(-1);refresh(()=>step(-1))});
$('bNext').addEventListener('click',()=>{touched();if(adding)return addStep(1);refresh(()=>step(1))});
// 2番目のボタン：ふだんは「今日」、1週＋詳細では「戻る」（タップした元のページへ。選んでいた日の月・週を出す）
$('bToday').addEventListener('click',()=>{touched();
  if(adding)return closeAdd();
  if(mode==='w1')refresh(()=>{mode=backMode;view=new Date(sel.getFullYear(),sel.getMonth(),1);ws=sunday(sel)});
  else refresh(goHome);
});
// 3番目のボタン：ふだんは「表示切替」、1週＋詳細では「＋予定を追加」
$('bView').addEventListener('click',()=>{touched();
  if(adding)return submit();
  if(mode==='w1'){if(!canAdd())say('予定の追加の設定がされていません');else{if(sel<T){sel=T;ws=sunday(T)}openAdd()}return}
  const nm=MODE_NAME[MODES[(MODES.indexOf(mode)+1)%MODES.length]];refresh(nextMode);say(`表示：${nm}`)});
// マスをタップ：2週＋詳細・1週＋詳細ではその日を選ぶ。月・月（大）・3週ではその日を選んで1週＋詳細へ
$('grid').addEventListener('click',e=>{
  const c=e.target.closest('.c');if(!c)return;
  const d=parseKey(c.dataset.d);touched();
  if(mode==='w2')refresh(()=>{sel=d;ws=sunday(d);if(sel>addD(ws,13))ws=addD(ws,7)});
  else refresh(()=>{if(mode!=='w1')backMode=mode;sel=d;ws=sunday(d);mode='w1'});
});


// 日付が変わったら描き直す
setInterval(()=>{applyNight();const t=today();if(+t!==+T){const home=isHome();T=t;if(home)goHome();render()}},60000);

function fit(){
  const bar=$('bar'),msg=$('msg'),wrap=$('wrap');
  const reserve=bar.offsetHeight+msg.offsetHeight+10;
  // 横幅いっぱいに合わせ、紙面の高さは残りの縦に合わせる（極端に低くならないよう1500〜2400に収める）
  let s=(innerWidth-12)/W;
  H=Math.round((innerHeight-reserve)/s);
  if(H<1500||H>2400){H=Math.min(2400,Math.max(1500,H));s=Math.min(s,(innerHeight-reserve)/H)}
  wrap.style.width=W*s+'px';wrap.style.height=H*s+'px';
  $('paper').style.height=H+'px';
  $('paper').style.transform=`scale(${s})`;
  bar.style.width=msg.style.width=W*s+'px';
}
addEventListener('resize',()=>{if(adding)return;fit();render()}); // 入力中はキーボードで高さが変わるので合わせ直さない
// 10分ごとに表示中の範囲を取り直す
setInterval(()=>ensure(true),600000);
$('msg').textContent=MSG;
fit();render();ensure();applyNight();
}
</script>
